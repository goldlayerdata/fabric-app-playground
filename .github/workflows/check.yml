# Runs the same checks as the deploy on every pull request, so a change is checked before it is merged.
# Merging to main is what publishes the site (pages.yml).
name: Check a pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the saved step positions check compares the lessons with an older commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
